[project]
name = "free-plaud-pipeline"
version = "0.1.0"
description = "Backend local-first para pipeline RAG experimental do TCC free-plaud"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "pypdf>=5.9.0",
  "typer>=0.16.0",
  "rich>=14.0.0",
  "chromadb>=1.5.7",
  "sentence-transformers>=5.4.1",
  "textual>=8.2.7",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
]
gpu-cu128 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "torchaudio>=2.11.0",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.22.2",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.16.3",
]

[project.scripts]
free-plaud = "free_plaud.cli:app"
free-plaud-tui = "free_plaud.tui.app:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# B008: Typer requires calling Argument()/Option() as parameter defaults.
# RUF012: Textual widgets declare BINDINGS as a class attribute by design.
# BLE001: doctor/embed boundary code intentionally catches any exception to report diagnostics without crashing.
# TRY004: input/response validation here intentionally raises ValueError, not TypeError.
ignore = ["B008", "RUF012", "BLE001", "TRY004"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin' and extra == 'gpu-cu128'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin' and extra == 'gpu-cu128'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin' and extra == 'gpu-cu128'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/free_plaud"]
