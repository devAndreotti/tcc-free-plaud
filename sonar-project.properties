# sonar-project.properties
# ──────────────────────────────────────────────────────
# Substitua YOUR_ORG e YOUR_REPO pelos valores reais.
# Estes valores também aparecem na URL do SonarCloud:
# https://sonarcloud.io/project/overview?id=YOUR_ORG_YOUR_REPO
# ──────────────────────────────────────────────────────

sonar.projectKey=YOUR_ORG_YOUR_REPO
sonar.organization=YOUR_ORG

# Nome exibido na interface do SonarCloud
sonar.projectName=YOUR_REPO

# Diretório raiz do código-fonte

# Arquivos de teste (excluídos da análise de produção)

# Exclusões gerais

# Coverage: aponta para o lcov gerado pelo Jest

# TypeScript: deixa o SonarCloud usar o tsconfig do projeto

# Encoding
sonar.sourceEncoding=UTF-8

sonar.sources=pipeline/src
sonar.tests=pipeline/tests
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py,**/*_test.py
sonar.exclusions=**/.venv/**,**/.pytest_cache/**,**/coverage/**,**/__pycache__/**
sonar.python.coverage.reportPaths=coverage/coverage.xml
